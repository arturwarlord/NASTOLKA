name: NASTOLKA — проверка сайта

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Проверка frontend
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Проверить наличие основных файлов
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s rooms.js
          test -s supabase-config.js
          test -s supabase/schema.sql
          test -s supabase/multiplayer.sql
          test -s supabase/game-sync.sql
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
          echo "Основные файлы найдены."

      - name: Проверить интерфейс резервного копирования карт
        run: |
          grep -q "function exportMaps" app.js
          grep -q "function importMapsFile" app.js
          grep -q "nastolka-maps" app.js
          grep -q "new Set(Object.keys(tileInfo))" app.js
          echo "Экспорт, импорт и проверка формата карт найдены."

      - name: Проверить синтаксис JavaScript
        run: |
          node --check app.js
          node --check rooms.js
          node --check supabase-config.js

      - name: Проверить обязательные элементы страницы
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="collections"', 'id="shop"', 'id="my-maps"',
              'id="gameDialog"', 'id="mapBackupTools"', 'id="exportMapsBtn"', 'id="importMapsFile"', 'id="createDialog"', 'id="searchDialog"',
              'id="rollDice"', 'id="mapForm"', 'id="all-games"',
              'id="customGamePanel"', 'id="playerCount"', 'id="startGameBtn"',
              'id="playBoard"', 'id="playRollBtn"', 'id="restartGameBtn"', 'id="resumeGameBtn"',
              'id="gameStatsSummary"', 'id="gameHistoryList"', 'id="gameHistoryTitle"',
              'id="playerNameFields"', 'id="playerStatsList"', 'id="current-games"', 'id="createRoomDialog"', 'id="createRoomForm"', 'id="roomsList"', 'id="roomLobby"',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Не найдены элементы: {', '.join(missing)}")
          js = Path("app.js").read_text(encoding="utf-8")
          for feature in ["nastolka-game-history", "function renderGameStats()", "gameState.recorded=true", "nastolka-player-names", "function renderPlayerNameFields()", "playerStatsList", "function buildPresetMap(game)", "function persistGameSession()", "function resumeCustomGame()", "nastolka-active-session", "function renderFinalResults()", "game-result-row"]:
              if feature not in js:
                  raise SystemExit(f"Не найдена логика истории партий: {feature}")
          rooms = Path("rooms.js").read_text(encoding="utf-8")
          for feature in ["nastolka_create_room", "nastolka_join_room", "nastolka_begin_game", "nastolka_submit_turn", "nastolka_leave_room", "roomConnectionStatus"]:
              if feature not in rooms:
                  raise SystemExit(f"Не найдена логика онлайн-комнат: {feature}")
          sql = Path("supabase/schema.sql").read_text(encoding="utf-8")
          multiplayer = Path("supabase/multiplayer.sql").read_text(encoding="utf-8")
          for feature in ["nastolka_rooms", "nastolka_room_players", "nastolka_player_secrets", "nastolka_create_room", "nastolka_join_room", "nastolka_start_room", "nastolka_leave_room", "enable row level security"]:
              if feature.lower() not in sql.lower():
                  raise SystemExit(f"Не найдена схема онлайн-комнат: {feature}")
          for feature in ["nastolka_begin_game", "nastolka_submit_turn", "game_version", "online_player_ids"]:
              if feature.lower() not in multiplayer.lower():
                  raise SystemExit(f"Не найдена синхронизация онлайн-партии: {feature}")
          for feature in ["createInitialState", "showOnline", "nastolka_submit_turn", "game_state", "game_version"]:
              if feature not in rooms and feature not in js:
                  raise SystemExit(f"Не найдена синхронизация онлайн-партии: {feature}")
          print("Проверка структуры страницы, истории партий и онлайн-комнат пройдена.")
          PY

name: NASTOLKA — проверка сайта

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Проверка frontend
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Проверить наличие основных файлов
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
          echo "Основные файлы найдены."

      - name: Проверить синтаксис JavaScript
        run: node --check app.js

      - name: Проверить обязательные элементы страницы
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="collections"', 'id="shop"', 'id="my-maps"',
              'id="gameDialog"', 'id="createDialog"', 'id="searchDialog"',
              'id="rollDice"', 'id="mapForm"', 'id="all-games"',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Не найдены элементы: {', '.join(missing)}")
          print("Проверка структуры страницы пройдена.")
          PY

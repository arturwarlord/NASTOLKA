name: NASTOLKA — проверка сайта

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Проверка frontend
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Проверить наличие основных файлов
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s rooms.js
          test -s supabase-config.js
          test -s supabase/schema.sql
          test -s supabase/multiplayer.sql
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
          grep -q 'world-3d.js' index.html
          grep -q 'function init3DBoard()' world-3d.js
          grep -q 'board-3d-ready' styles.css
          echo "Основные файлы найдены."

      - name: Проверить интерфейс резервного копирования карт
        run: |
          grep -q "function exportMaps" app.js
          grep -q "function importMapsFile" app.js
          grep -q "nastolka-maps" app.js
          grep -q "new Set(Object.keys(tileInfo))" app.js
          echo "Экспорт, импорт и проверка формата карт найдены."


      - name: Проверить иллюстрации игровых миров
        run: |
          test -s assets/adventure-atmosphere.svg
          test -s assets/scene-island.svg
          test -s assets/scene-city.svg
          test -s assets/scene-mystery.svg
          test -s assets/scene-neon.svg
          test -s assets/scene-cosmos.svg
          grep -q 'scene-island.svg' styles.css
          grep -q 'scene-city.svg' styles.css
          grep -q 'scene-mystery.svg' styles.css
          grep -q 'scene-neon.svg' styles.css
          grep -q 'scene-cosmos.svg' styles.css
          grep -q 'play-cell.off-route{opacity:.82' styles.css
          echo "Иллюстрации миров и тематические поверхности найдены."
          grep -q 'Diorama pass 2' styles.css
          grep -q 'tile-empty:before' styles.css
          grep -q 'data-game-scene="island".*tile-empty' styles.css
          grep -q 'data-game-scene="city".*tile-empty' styles.css
          grep -q 'data-game-scene="mystery".*tile-empty' styles.css
          grep -q 'data-game-scene="neon".*tile-empty' styles.css
          grep -q 'data-game-scene="cosmos".*tile-empty' styles.css
          grep -q 'styles.css?v=' index.html
          grep -q 'app.js?v=' index.html
          grep -q 'world-3d.js?v=' index.html
          grep -q 'id="mapZoomIn"' index.html
          grep -q 'id="mapZoomOut"' index.html
          grep -q 'id="mapViewReset"' index.html
          grep -q 'id="mapHistoryToggle"' index.html
          echo "Объёмные поверхности, тематические декорации, полноэкранная карта и навигация найдены."

      - name: Проверить синтаксис JavaScript
        run: |
          node --check app.js
          node --check world-3d.js
          node --check rooms.js
          node --check supabase-config.js

      - name: Проверить полноэкранную карту в браузере
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/browser-smoke.mjs

      - name: Проверить обязательные элементы страницы
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="collections"', 'id="shop"', 'id="my-maps"',
              'id="gameDialog"', 'id="mapBackupTools"', 'id="exportMapsBtn"', 'id="importMapsFile"', 'id="createDialog"', 'id="searchDialog"',
              'id="rollDice"', 'id="mapForm"', 'id="all-games"',
              'id="customGamePanel"', 'id="playerCount"', 'id="startGameBtn"',
              'id="playBoard"', 'id="playRollBtn"', 'id="restartGameBtn"', 'id="resumeGameBtn"',
              'id="gameStatsSummary"', 'id="gameHistoryList"', 'id="gameHistoryTitle"',
              'id="playerNameFields"', 'id="playerStatsList"', 'id="current-games"', 'id="createRoomDialog"', 'id="createRoomForm"', 'id="roomsList"', 'id="roomLobby"',
              'game-mode', 'game-world-props', 'illustrated-world-4', 'game-world-topbar', 'game-world-back', 'game-world-ambient', 'gameWorldPopout', 'onlineRoom',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f"Не найдены элементы: {', '.join(missing)}")
          js = Path("app.js").read_text(encoding="utf-8")
          for feature in ["nastolka-game-history", "function renderGameStats()", "gameState.recorded=true", "nastolka-player-names", "function renderPlayerNameFields()", "playerStatsList", "function buildPresetMap(game)", "sceneProps[scene]", "function persistGameSession()", "function resumeCustomGame()", "nastolka-active-session", "function renderFinalResults()", "game-result-row"]:
              if feature not in js:
                  raise SystemExit(f"Не найдена логика истории партий: {feature}")
          rooms = Path("rooms.js").read_text(encoding="utf-8")
          for feature in ["nastolka_create_room", "nastolka_join_room", "nastolka_begin_game", "nastolka_submit_turn", "nastolka_leave_room", "roomConnectionStatus"]:
              if feature not in rooms:
                  raise SystemExit(f"Не найдена логика онлайн-комнат: {feature}")
          sql = Path("supabase/schema.sql").read_text(encoding="utf-8")
          multiplayer = Path("supabase/multiplayer.sql").read_text(encoding="utf-8")
          for feature in ["nastolka_rooms", "nastolka_room_players", "nastolka_player_secrets", "nastolka_create_room", "nastolka_join_room", "nastolka_start_room", "nastolka_leave_room", "enable row level security"]:
              if feature.lower() not in sql.lower():
                  raise SystemExit(f"Не найдена схема онлайн-комнат: {feature}")
          for feature in ["nastolka_begin_game", "nastolka_submit_turn", "game_version", "online_player_ids"]:
              if feature.lower() not in multiplayer.lower():
                  raise SystemExit(f"Не найдена синхронизация онлайн-партии: {feature}")
          for feature in ["createInitialState", "showOnline", "nastolka_submit_turn", "game_state", "game_version"]:
              if feature not in rooms and feature not in js:
                  raise SystemExit(f"Не найдена синхронизация онлайн-партии: {feature}")
          for feature in ["setInterval", "visibilitychange", "loadRoomsInProgress", "function resumeRoom(room)", "Вернуться в игру", "localStorage.getItem(roomIdKey)"]:
              if feature not in rooms:
                  raise SystemExit(f"Не найдена защита переподключения и возврат в комнату: {feature}")
          if "incomingVersion <= Number(onlineGameContext.version || 0)" not in js:
              raise SystemExit("Не найдена защита от устаревшего состояния партии.")
          if "document.documentElement.classList.add('game-mode')" not in js:
              raise SystemExit("Онлайн-партия не переключает интерфейс в полноэкранный режим.")
          for feature in ["cell-terrain", "path-inlay", "dice-rolling", "treasureShimmer", "arcanePulse"]:
              if feature not in js and feature not in Path("styles.css").read_text(encoding="utf-8"):
                  raise SystemExit(f"Не найдены новые детали приключенческого поля: {feature}")
          for feature in ["window.open(url.toString(),'_blank','noopener')", "setGameScene(map)", "current-player-cell", "route-step", "player-token-"]:
              if feature not in js and feature not in Path("styles.css").read_text(encoding="utf-8") and feature not in html:
                  raise SystemExit(f"Не найдены детали игрового оформления: {feature}")
          print("Проверка структуры страницы, истории партий, онлайн-синхронизации и восстановления соединения пройдена.")
          PY
